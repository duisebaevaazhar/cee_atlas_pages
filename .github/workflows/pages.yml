name: Deploy Atlas to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build and verify complete V11 page
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          parts = [Path(f"v11.{i}.b64").read_text(encoding="ascii") for i in range(6)]
          packed = base64.b64decode("".join("".join(parts).split()), validate=True)
          page = gzip.decompress(packed)
          digest = hashlib.sha256(page).hexdigest()
          expected = "0719d8bae7779f2c12b55719d3eb37115ab370cc5595e0366673a116bc9236eb"
          if digest != expected:
              raise SystemExit(f"Report integrity check failed: {digest}")
          text = page.decode("utf-8")
          for marker in ('id="buying"', 'class="card country-deal"', 'id="dealer-tech"', 'id="digital-stack360"'):
              if marker not in text:
                  raise SystemExit(f"Required V11 section missing: {marker}")

          # Verify MYLEADS bundle can be reconstructed before deploy.
          myleads_parts = [Path(f"myleads/page.{i}.b64").read_text(encoding="ascii") for i in range(5)]
          myleads_packed = base64.b64decode("".join("".join(myleads_parts).split()), validate=True)
          myleads_page = gzip.decompress(myleads_packed)
          myleads_text = myleads_page.decode("utf-8")
          for marker in ('id="legal"', 'id="insurers"', 'id="payment"', 'id="sources"'):
              if marker not in myleads_text:
                  raise SystemExit(f"Required MYLEADS section missing: {marker}")

          output = Path("_site")
          output.mkdir(exist_ok=True)
          (output / "index.html").write_bytes(page)
          (output / ".nojekyll").write_text("", encoding="utf-8")
          (output / "version.json").write_text(json.dumps({
              "version": "V11",
              "sha256": digest,
              "commit": os.environ.get("GITHUB_SHA", ""),
              "format": "standalone-html"
          }, indent=2), encoding="utf-8")

          target = output / "myleads"
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree("myleads", target)

          studio_source = Path("studio")
          studio_target = output / "studio"
          if studio_source.exists():
              if studio_target.exists():
                  shutil.rmtree(studio_target)
              shutil.copytree(studio_source, studio_target)

          mycar_source = Path("mycar-pro")
          mycar_target = output / "mycar-pro"
          if not mycar_source.exists():
              raise SystemExit("MyCar Pro source folder missing")
          if mycar_target.exists():
              shutil.rmtree(mycar_target)
          shutil.copytree(mycar_source, mycar_target)
          if not (mycar_target / "index.html").exists():
              raise SystemExit("MyCar Pro index.html missing")

          print(f"Verified V11: {len(page)} bytes; SHA256 {digest}")
          print(f"Verified MYLEADS: {len(myleads_page)} bytes")
          print("Included STUDIO concept page")
          print("Included MyCar Pro process map")
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload verified static report
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
