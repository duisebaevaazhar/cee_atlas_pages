<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYLEADS Insurance Marketplace</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:#08111c;color:#f4f7fb;display:grid;place-items:center;min-height:100vh}.box{max-width:640px;padding:36px;text-align:center}.spinner{width:36px;height:36px;border:3px solid #243850;border-top-color:#59c8ff;border-radius:50%;margin:0 auto 18px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}p{color:#9cafc6}</style></head><body><div class="box"><div class="spinner"></div><h2>Загружаем MYLEADS Insurance Marketplace</h2><p>Открываем business + legal evaluation.</p></div><script>(async()=>{try{const files=['page.0.b64','page.1.b64','page.2.b64','page.3.b64','page.4.b64'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=1').then(r=>{if(!r.ok)throw new Error('Не удалось загрузить '+f);return r.text()})));const b64=parts.join('').replace(/\s/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(!('DecompressionStream' in window))throw new Error('Браузер не поддерживает распаковку страницы. Откройте ссылку в актуальном Chrome, Edge, Safari или Firefox.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Не удалось открыть страницу</h2><p>'+e.message+'</p></div>';console.error(e)}})();</script></body></html>
